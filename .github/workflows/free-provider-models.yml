name: Requested models live verification

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify-modelscope:
    if: >-
      github.repository == 'jerrish18/Mcp-hub' &&
      github.event.pull_request.number == 2 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/free-provider-expansion'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: free-provider-testing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify ModelScope free routes through the MCP Hub relay
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
        run: |
          if [ -z "$MODELSCOPE_API_TOKEN" ]; then
            echo "::notice::Live test skipped. Missing environment secret MODELSCOPE_API_TOKEN."
            exit 0
          fi
          node --import tsx --input-type=module <<'EOF_RELAY'
          import assert from 'node:assert/strict';
          import { once } from 'node:events';
          import { setTimeout as delay } from 'node:timers/promises';
          import express from 'express';
          import { createFreeAiRouter } from './src/server/freeAiRouter.ts';
          import { streamSseData } from './src/services/llm/sse.ts';

          const app = express();
          app.use('/api', createFreeAiRouter());
          const server = app.listen(0, '127.0.0.1');
          await once(server, 'listening');
          try {
            const base = 'http://127.0.0.1:' + server.address().port + '/api/free-ai/modelscope';
            const headers = { Authorization: 'Bearer ' + process.env.MODELSCOPE_API_TOKEN.trim(), 'Content-Type': 'application/json', 'X-MCPHub-UI': '1' };
            const catalog = await fetch(base + '/models', { headers, signal: AbortSignal.timeout(20_000) });
            assert.equal(catalog.status, 200);
            const ids = (await catalog.json()).data.map((row) => row.id);
            const chat = (model) => fetch(base + '/chat/completions', {
              method: 'POST', headers, signal: AbortSignal.timeout(90_000),
              body: JSON.stringify({ model, max_tokens: 4096, messages: [{ role: 'user', content: 'Reply with the number 7.' }] }),
            });
            const blocked = await chat('MiniMax/MiniMax-M3');
            assert.equal(blocked.status, 403);
            await blocked.body?.cancel();
            console.log(JSON.stringify({ unverifiedRouteBlocked: true }));
            let failures = 0;
            for (const model of ['zai-org/GLM-4.7-Flash', 'zai-org/GLM-5.2', 'deepseek-ai/DeepSeek-V4.1-Flash-1017']) {
              assert.ok(ids.includes(model));
              let response = await chat(model);
              if (response.status === 429) {
                const retry = response.headers.get('retry-after') ?? '';
                const seconds = /^\d+$/.test(retry) ? Number(retry) : undefined;
                if (seconds !== undefined && seconds <= 30) {
                  await response.body?.cancel();
                  await delay(Math.max(seconds, 1) * 1000);
                  response = await chat(model);
                }
              }
              if (response.status !== 200) {
                console.log(JSON.stringify({ model, streamedThroughRelay: false, status: response.status }));
                await response.body?.cancel();
                failures++;
                continue;
              }
              assert.match(response.headers.get('content-type'), /text\/event-stream/);
              let received = false;
              let complete = false;
              for await (const frame of streamSseData(response.body, () => { complete = true; })) {
                const choice = JSON.parse(frame).choices?.[0];
                if (choice?.delta?.content?.trim()) received = true;
                if (choice?.finish_reason === 'stop') complete = true;
              }
              const passed = received && complete;
              if (!passed) failures++;
              console.log(JSON.stringify({ model, streamedThroughRelay: passed }));
            }
            if (failures) process.exitCode = 1;
          } finally {
            server.close();
          }
          EOF_RELAY
