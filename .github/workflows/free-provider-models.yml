name: Requested models live verification

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify-modelscope:
    if: >-
      github.repository == 'jerrish18/Mcp-hub' &&
      github.event.pull_request.number == 2 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/free-provider-expansion'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: free-provider-testing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Diagnose ModelScope inference access
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
        run: |
          if [ -z "$MODELSCOPE_API_TOKEN" ]; then
            echo "::notice::Live test skipped. Missing environment secret MODELSCOPE_API_TOKEN."
            exit 0
          fi
          node --import tsx --input-type=module <<'EOF_PROBE'
          import { catalogRoute, providerEndpoint, readProviderCatalog } from './src/services/llm/freeRegistry.ts';

          const provider = 'modelscope';
          const modelscope = process.env.MODELSCOPE_API_TOKEN.trim();
          const model = 'zai-org/GLM-4.7-Flash';
          const row = (await readProviderCatalog(provider, { modelscope }, fetch, AbortSignal.timeout(15_000)))
            .find((entry) => entry.id === model);
          if (!row || !catalogRoute(provider, row)) throw new Error('The test model is no longer in the eligible catalog.');

          const issues = [
            ['account binding', /绑定|bind(?:ing)?[^.]{0,45}(?:alibaba|account)|alibaba[^.]{0,45}link/i],
            ['identity verification', /实名|real.?name|identity verific/i],
            ['scope or permission', /scope|permission|accessdenied/i],
            ['quota', /quota|insufficient|余额|额度|grain/i],
            ['token rejected', /access.?token|invalid.?key|unauthenticated|authenti[cz]ation/i],
            ['security filter', /cloudflare|security (?:policy|check)|request (?:blocked|rejected)|waf/i],
            ['location or region', /region|country|location|地区/i],
          ];
          for (const [path, body] of [
            ['chat/completions', { model, messages: [{ role: 'user', content: 'Hello. Reply with one word.' }], max_tokens: 128 }],
            ['responses', { model, input: 'Hello. Reply with one word.', max_output_tokens: 128 }],
          ]) {
            const res = await fetch(providerEndpoint(provider) + '/' + path, {
              method: 'POST', redirect: 'error', signal: AbortSignal.timeout(20_000),
              headers: { Authorization: 'Bearer ' + modelscope, 'Content-Type': 'application/json', Accept: 'application/json' },
              body: JSON.stringify(body),
            });
            const mime = res.headers.get('content-type') ?? '';
            const payload = await res.text();
            let issue;
            let code;
            if (!res.ok && mime.includes('json')) {
              const parsed = JSON.parse(payload);
              const source = parsed.error ?? parsed;
              const value = source.code ?? source.Code;
              if (typeof value === 'number') code = value;
              issue = issues.find(([, expression]) => expression.test(String(source.message ?? source.Message ?? '')))?.[0];
            }
            if (!res.ok && !issue && /html/i.test(mime)) issue = 'HTML gateway response';
            console.log(JSON.stringify({ path, status: res.status, issue, code, json: mime.includes('json') }));
          }
          EOF_PROBE
