name: GLM 5.3 Flash live verification

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.repository == 'jerrish18/Mcp-hub' &&
      github.event.pull_request.number == 2 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/free-provider-expansion'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: free-provider-testing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify NVIDIA GLM 5.3 Flash free route
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          test -n "$NVIDIA_API_KEY" || { echo "::error::NVIDIA_API_KEY is missing."; exit 1; }
          npm run --silent verify:free-route -- nvidia z-ai/glm-5.3-flash
