name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck & ESLint
        run: npm run lint

      - name: Run unit test suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Typecheck mobile app
        run: npm run typecheck --prefix mobile

      - name: Build Android JavaScript bundle
        working-directory: mobile
        run: npx expo export --platform android --max-workers 2 --output-dir dist
